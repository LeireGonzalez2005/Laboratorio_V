<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de misiones RPG</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Gestor de misiones RPG</h1>
      <p>Crea y organiza las aventuras de tu juego.</p>
    </header>

    <section>
      <h2>Nueva misión</h2>
      <form id="formulario-mision">
        <label for="titulo">Título de la misión</label>
        <input id="titulo" name="titulo" type="text" required placeholder="El bosque encantado">

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" required placeholder="Describe el objetivo de la misión"></textarea>

        <label for="dificultad">Dificultad</label>
        <select id="dificultad" name="dificultad" required>
          <option value="">Selecciona una dificultad</option>
          <option value="Fácil">Fácil</option>
          <option value="Media">Media</option>
          <option value="Difícil">Difícil</option>
        </select>

        <label for="recompensa">Recompensa</label>
        <input id="recompensa" name="recompensa" type="text" required placeholder="100 monedas de oro">
        <button type="submit">Añadir misión</button>
      </form>
    </section>

    <section>
      <h2>Misiones actuales</h2>
      <div class="acciones">
        <button id="borrar-todo" type="button" class="peligro">Borrar todo</button>
        <button id="subir-servidor" type="button" disabled>Subir al servidor</button>
        <button id="bajar-servidor" type="button" disabled>Bajar del servidor</button>
      </div>
      <p class="ayuda">Los botones del servidor se activarán en la fase 2.</p>
      <p id="mensaje"></p>
      <p id="lista-vacia">Todavía no hay misiones.</p>
      <ul id="lista-misiones"></ul>
    </section>
  </main>
</body>
</html>
